<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favCloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="favBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- High contrast dark rounded backdrop -->
  <rect width="128" height="128" rx="28" fill="#0f172a" />

  <!-- Cloud Outline / Body -->
  <path d="M 44 90 
           C 32 90 22 80 22 68 
           C 22 57 30 48 41 47 
           C 44 32 58 20 74 20 
           C 88 20 100 29 104 42 
           C 114 43 122 51 122 62 
           C 122 74 112 84 100 84 
           H 92" 
        fill="none" 
        stroke="url(#favCloud)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Cache Tier Bar -->
  <rect x="36" y="96" width="56" height="8" rx="4" fill="url(#favCloud)" />

  <!-- Speed Lightning Bolt -->
  <polygon points="68,36 48,68 64,68 58,94 82,60 68,60" 
           fill="url(#favBolt)" 
           stroke="#0f172a" 
           stroke-width="1.5" 
           stroke-linejoin="round" />
</svg>
