<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-label="Cloud Cache Action Logo">
  <title>Cloud Cache Action Logo</title>
  <desc>A glowing cloud with cache tiers and high speed lightning bolt</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Cloud Stroke & Fill Gradients -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="cloudGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
    </linearGradient>

    <!-- Bolt / Speed Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Storage Disc Gradients -->
    <linearGradient id="discGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="discGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Background Ambient Glow Behind Cloud -->
  <circle cx="256" cy="230" r="140" fill="#0ea5e9" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="280" cy="270" r="120" fill="#6366f1" opacity="0.12" filter="url(#softGlow)" />

  <!-- Stylized Cloud Silhouette -->
  <path d="M 180 340 
           C 142 340 112 312 112 276 
           C 112 243 136 216 168 213 
           C 177 165 218 128 268 128 
           C 310 128 346 154 360 192 
           C 388 196 410 220 410 250 
           C 410 284 382 312 348 312 
           H 330" 
        fill="url(#cloudGlow)" 
        stroke="url(#cloudGrad)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Dual-Cache / Storage Cylinders at base -->
  <!-- Lower Storage Tier (S3 Remote Storage) -->
  <g opacity="0.95">
    <path d="M 165 375 C 165 358 206 345 256 345 C 306 345 347 358 347 375 V 395 C 347 412 306 425 256 425 C 206 425 165 412 165 395 Z" 
          fill="url(#discGrad1)" />
    <ellipse cx="256" cy="375" rx="91" ry="24" fill="#818cf8" fill-opacity="0.4" stroke="#a5b4fc" stroke-width="3" />
  </g>

  <!-- Upper Storage Tier (Local Runner Fast Cache) -->
  <g opacity="0.98">
    <path d="M 175 330 C 175 315 211 303 256 303 C 301 303 337 315 337 330 V 346 C 337 361 301 373 256 373 C 211 373 175 361 175 346 Z" 
          fill="url(#discGrad2)" />
    <ellipse cx="256" cy="330" rx="81" ry="20" fill="#38bdf8" fill-opacity="0.6" stroke="#bae6fd" stroke-width="3" />
  </g>

  <!-- Central High-Speed Cache Lightning Bolt -->
  <polygon points="272,165 210,270 260,270 240,355 316,242 266,242" 
           fill="url(#boltGrad)" 
           stroke="#ffffff" 
           stroke-width="3" 
           stroke-linejoin="round" 
           filter="url(#boltGlow)" />

  <!-- Small accent dots/stars representing data chunks -->
  <circle cx="370" cy="160" r="4" fill="#38bdf8" opacity="0.8" />
  <circle cx="395" cy="175" r="2.5" fill="#bae6fd" opacity="0.6" />
  <circle cx="135" cy="200" r="3" fill="#818cf8" opacity="0.7" />
</svg>
